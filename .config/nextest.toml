# cargo-nextest settings (gates/ci.sh uses nextest when it is installed, as CI does).

# No test group: every test runs alongside the others. The record tests read the unit corpus one
# record at a time (closure_testing::corpus::records); the four that read all of it (cross_checks,
# records_load, unit_replay_runner, access_controls_records) peak at about 0.5 GB or less and
# no other test needs more than about 1.4 GB, well within a 16 GB CI runner.
