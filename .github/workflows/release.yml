# Builds the closure-rs CLI for Linux and Windows, checks it, tests the npm wrapper (npm/closure-rs/)
# against each binary, and packs ONE npm package `closure-rs` with both binaries bundled
# (bin/<platform>-<arch>/; the wrapper picks the one for the running machine).
# The Linux binary is static (target x86_64-unknown-linux-musl): it runs on any x86-64 Linux, glibc
# or musl (Alpine), with no C library version requirement.
# Publishing is a separate, manual job: run the workflow by hand with "publish" checked. It uses npm
# trusted publishing (GitHub OIDC, no stored token): the package's npm settings must name this
# repository, this workflow file and the environment `npm`. Nothing is published otherwise.
name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the packed npm package'
        type: boolean
        default: false
      dist_tag:
        description: 'npm dist-tag to publish under (latest: what a plain `npm install closure-rs` gets; exp: experimental builds)'
        type: choice
        options: [alpha, latest, exp]
        default: alpha

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.platform }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # static: musl's C library and LLVM's libunwind are linked in, no system C library needed
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            exe: closure-rs
            target: x86_64-unknown-linux-musl
            out: target/x86_64-unknown-linux-musl/release
          - os: windows-latest
            platform: win32
            arch: x64
            exe: closure-rs.exe
            out: target/release
    runs-on: ${{ matrix.os }}
    env:
      # the shipped binary, tested by every step below
      BIN: bins/${{ matrix.platform }}-${{ matrix.arch }}/${{ matrix.exe }}
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins the toolchain; rustup installs it on first use
      - name: Rust toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install

      # musl-tools: musl-gcc, which the cc crate uses for the C code of the -sys crates (mimalloc,
      # zlib); rustc links with the musl libc.a and crt objects of the Rust target itself
      - name: musl target
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update -q && sudo apt-get install -y -q musl-tools

      - uses: Swatinem/rust-cache@v2

      - name: Build the CLI (release)
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --bin closure-rs ${TARGET:+--target "$TARGET"}

      # the release profile keeps debug info for the D2 runs; the shipped binary is stripped
      - name: Stage the binary (bins/<platform>-<arch>/)
        shell: bash
        run: |
          mkdir -p bins/${{ matrix.platform }}-${{ matrix.arch }}
          cp ${{ matrix.out }}/${{ matrix.exe }} "$BIN"
          if [ "${{ matrix.platform }}" = linux ]; then strip "$BIN"; fi

      - name: Static binary (no dynamic loader, no shared libraries)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          file "$BIN"
          file "$BIN" | grep -Eq 'statically linked|static-pie linked'

      - name: Smoke test (ADVANCED compile)
        shell: bash
        run: |
          printf 'function greet(name){var unused=1;return "Hello, "+name}\nwindow["greet"]=greet;\nconsole.log(greet("world"));\n' > smoke.js
          out=$("$BIN" --compilation_level=ADVANCED --js=smoke.js)
          echo "$out"
          test "$out" = 'function a(b){return"Hello, "+b}window.greet=a;console.log(a("world"));'

      # The official node:24-alpine image, from a mirror first: Docker Hub rate-limits the shared
      # runner addresses. The docker run steps below use the image pulled here.
      - name: Pull node:24-alpine
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            for image in mirror.gcr.io/library/node:24-alpine \
                public.ecr.aws/docker/library/node:24-alpine docker.io/library/node:24-alpine; do
              if docker pull -q "$image"; then
                docker tag "$image" node:24-alpine
                exit 0
              fi
              echo "::warning::could not pull $image"
            done
            sleep $((attempt * 20))
          done
          exit 1

      - name: Smoke test on Alpine (musl, no gcompat)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          out=$(docker run --rm -v "$PWD:/w" -w /w node:24-alpine "$BIN" --compilation_level=ADVANCED --js=smoke.js)
          echo "$out"
          test "$out" = 'function a(b){return"Hello, "+b}window.greet=a;console.log(a("world"));'

      - name: Third-party crate licenses match Cargo.lock
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          cargo fetch --locked
          python3 scripts/third_party_licenses.py --check

      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: 24

      - name: Test the npm wrapper against this binary
        shell: bash
        run: CLOSURE_RS_BINARY="$BIN" node --test npm/closure-rs/test/wrapper.test.mjs

      - name: Test the npm wrapper against this binary on Alpine (musl, no gcompat)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          docker run --rm -v "$PWD:/w" -w /w -e CLOSURE_RS_BINARY="$BIN" node:24-alpine \
            node --test npm/closure-rs/test/wrapper.test.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.platform }}-${{ matrix.arch }}
          path: bins/
          if-no-files-found: error

  npm-main:
    name: pack the npm package (both binaries)
    needs: [build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: 24

      - name: Generate the TypeScript types (must match the committed index.d.ts)
        run: |
          node scripts/gen_npm_types.mjs
          git diff --exit-code -- npm/closure-rs/

      # contrib/ (CONTRIB_PATH) is the Closure Compiler repository's contrib/ folder at the pinned
      # reference commit (scripts/fetch_reference.sh); fetch only that folder.
      - name: Fetch contrib/ at the pinned reference commit
        run: |
          pin=$(. scripts/paths.sh && echo "$REF_COMMIT")
          git init -q build/closure-compiler
          git -C build/closure-compiler remote add origin https://github.com/google/closure-compiler.git
          git -C build/closure-compiler sparse-checkout set --no-cone /contrib/
          git -C build/closure-compiler fetch -q --depth 1 --filter=blob:none origin "$pin"
          git -C build/closure-compiler checkout -q FETCH_HEAD
          test -d build/closure-compiler/contrib/externs

      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          merge-multiple: true
          path: bins

      - name: Pack (npm pack --ignore-scripts)
        run: |
          mkdir -p dist
          node scripts/npm_pack_main.mjs dist --contrib build/closure-compiler/contrib --binaries bins

      - uses: actions/upload-artifact@v7
        with:
          name: npm-main
          path: dist/*.tgz
          if-no-files-found: error

  # gates/ci.sh split in two parallel jobs: lint (unsafe check, license headers, fmt, clippy, no
  # ignored tests) and test. Locally `bash gates/ci.sh` still runs both.
  lint:
    name: lint (fmt, clippy, licenses)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: gates/ci.sh --lint
        run: bash gates/ci.sh --lint

  # The tests are built without debug info and at opt-level 1: about 6x smaller than the default
  # test profile (which does not fit a runner's disk comfortably) and 3x faster to run. Overflow
  # checks and debug assertions stay on, so the tests check exactly what `cargo test` checks.
  # cargo-nextest runs every test in its own process, all test binaries in parallel.
  test:
    name: test (ubuntu)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_DEV_OPT_LEVEL: 1
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_TEST_OPT_LEVEL: 1
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Build the tests
        run: cargo nextest run --workspace --locked --no-run
      - name: gates/ci.sh --test
        run: bash gates/ci.sh --test

  publish:
    name: publish to npm (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [build, lint, test, npm-main]
    runs-on: ubuntu-22.04
    environment: npm
    permissions:
      contents: read
      id-token: write   # npm trusted publishing (OIDC); provenance is added automatically
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm-main
          path: dist
      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm >= 11.5.1 (trusted publishing)
        run: npm install -g npm@^11.5.1 --ignore-scripts
      - name: Publish (dist-tag from the run form)
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
        # ./ is required: npm reads a bare dist/x.tgz as the GitHub repository shorthand "dist/x.tgz"
        run: npm publish ./dist/*.tgz --tag "$DIST_TAG" --access public
