# Builds the closure-rs CLI for Linux (x64, arm64), macOS (arm64, x64) and Windows (x64), checks
# it, tests the npm wrapper (npm/closure-rs/) against each binary, checks that every binary writes
# the same bytes for the same compiles, and packs ONE npm package `closure-rs` with all binaries
# bundled (bin/<platform>-<arch>/; the wrapper picks the one for the running machine).
# The Linux binaries are static (targets x86_64- and aarch64-unknown-linux-musl): they run on any
# Linux of their CPU, glibc or musl (Alpine), with no C library version requirement.
# Publishing is a separate, manual job: run the workflow by hand with "publish" checked. It uses npm
# trusted publishing (GitHub OIDC, no stored token): the package's npm settings must name this
# repository, this workflow file and the environment `npm`. Nothing is published otherwise.
name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the packed npm package'
        type: boolean
        default: false
      dist_tag:
        description: 'npm dist-tag to publish under (latest: what a plain `npm install closure-rs` gets; exp: experimental builds)'
        type: choice
        options: [latest, exp]
        default: latest

# A newer push or pull-request run cancels an older one on the same ref. A release run (Run
# workflow) has a group of its own, so nothing cancels it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'ci' }}
  cancel-in-progress: true

jobs:
  # Inputs of the build jobs: three benchmark projects of bench/projects.json, fetched at their
  # pinned commits (about 11 MB), and compiler flags for them: pgo-training/, the training
  # compiles of the profile-guided build (scripts/pgo_build.sh), and platform-outputs/, the
  # compiles that every platform's binary must turn into the same bytes
  # (scripts/platform_outputs.py).
  inputs:
    name: benchmark inputs
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the projects and write their compiler flags
        run: |
          for attempt in 1 2 3; do
            scripts/fetch_bench.sh --project d3-12 --project lodash-es --project three && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep $((attempt * 20))
          done
          python3 scripts/run_bench.py --job '^(d3-12/.*/ADVANCED|lodash-es/.*|three/.*)$' \
            --write-args pgo-training
          python3 scripts/run_bench.py --job '^(d3-12/.*|lodash-es/.*|three/.*)$' \
            --write-args platform-outputs
      - uses: actions/upload-artifact@v7
        with:
          name: inputs
          path: |
            pgo-training/
            platform-outputs/
            bench-cache/d3-12/
            bench-cache/lodash-es/
            bench-cache/three/
          if-no-files-found: error

  build:
    name: build (${{ matrix.platform }}-${{ matrix.arch }})
    needs: [inputs]
    strategy:
      fail-fast: false
      matrix:
        include:
          # static: musl's C library and LLVM's libunwind are linked in, no system C library needed
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            exe: closure-rs
            target: x86_64-unknown-linux-musl
            out: target/x86_64-unknown-linux-musl/release
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            exe: closure-rs
            target: aarch64-unknown-linux-musl
            out: target/aarch64-unknown-linux-musl/release
          - os: macos-15
            platform: darwin
            arch: arm64
            exe: closure-rs
            out: target/release
          - os: macos-15-intel
            platform: darwin
            arch: x64
            exe: closure-rs
            out: target/release
          - os: windows-latest
            platform: win32
            arch: x64
            exe: closure-rs.exe
            out: target/release
    runs-on: ${{ matrix.os }}
    env:
      # the shipped binary, tested by every step below
      BIN: bins/${{ matrix.platform }}-${{ matrix.arch }}/${{ matrix.exe }}
      # macOS 11 (the first with Apple silicon) and later; Node.js 24 itself needs macOS 13.5
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      # zlib is compiled in from libz-sys' bundled sources on every platform (the Linux and Windows
      # builds do so anyway), never the system's libz: the same zlib everywhere
      LIBZ_SYS_STATIC: '1'
    steps:
      # The files as committed (LF), also on Windows: the cross-platform comparison compiles some of
      # them (bench/entries/) and needs the same input bytes everywhere
      - name: No line-ending conversion
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      # rust-toolchain.toml pins the toolchain; rustup installs it on first use (and rustup itself
      # is installed where the runner image has none)
      - name: Rust toolchain
        shell: bash
        run: |
          if ! command -v rustup >/dev/null; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show active-toolchain || rustup toolchain install

      # musl-tools: musl-gcc, which the cc crate uses for the C code of the -sys crates (mimalloc,
      # zlib); rustc links with the musl libc.a and crt objects of the Rust target itself. The cc
      # crate looks for aarch64-linux-musl-gcc on arm64, which Ubuntu does not have: CC_<target>
      # names musl-gcc.
      - name: musl target
        if: endsWith(matrix.target, '-linux-musl')
        shell: bash
        run: |
          rustup target add ${{ matrix.target }}
          sudo apt-get update -q && sudo apt-get install -y -q musl-tools
          t=${{ matrix.target }}
          echo "CC_${t//-/_}=musl-gcc" >> "$GITHUB_ENV"
          echo "AR_${t//-/_}=ar" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2

      # llvm-profdata for the profile-guided build
      - name: llvm-tools
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: rustup component add llvm-tools || echo "::warning::rustup could not add llvm-tools"

      - uses: actions/download-artifact@v8
        with:
          name: inputs
          path: .

      # Profile-guided in release runs (about 8% less CPU time; the output is the same). Should any
      # step of it fail, a publish run stops; any other run builds without a profile and shows a
      # warning. Pushes and pull requests build without a profile (it doubles the build time).
      - name: Build the CLI (release; profile-guided in release runs)
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PGO: ${{ github.event_name == 'workflow_dispatch' }}
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          if [ "$PGO" != true ]; then
            cargo build --release --locked --bin closure-rs ${TARGET:+--target "$TARGET"}
          elif ! bash scripts/pgo_build.sh --training pgo-training ${TARGET:+--target "$TARGET"}; then
            if [ "$PUBLISH" = true ]; then
              echo "::error::the profile-guided build failed; a publish run ships only profile-guided binaries"
              exit 1
            fi
            echo "::warning::the profile-guided build failed; building without a profile"
            cargo build --release --locked --bin closure-rs ${TARGET:+--target "$TARGET"}
          fi

      # The release profile keeps debug info for the D2 runs; the shipped binary is stripped. On
      # macOS stripping invalidates the linker's ad-hoc code signature, which Apple silicon
      # requires to run a binary: it is signed again (ad hoc, as the linker does).
      - name: Stage the binary (bins/<platform>-<arch>/)
        shell: bash
        run: |
          mkdir -p bins/${{ matrix.platform }}-${{ matrix.arch }}
          cp ${{ matrix.out }}/${{ matrix.exe }} "$BIN"
          case "${{ matrix.platform }}" in
            linux) strip "$BIN" ;;
            darwin)
              strip "$BIN"
              codesign --force --sign - "$BIN"
              codesign --verify --verbose "$BIN" ;;
          esac

      - name: Static binary (no dynamic loader, no shared libraries)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          file "$BIN"
          file "$BIN" | grep -Eq 'statically linked|static-pie linked'
          file "$BIN" | grep -q '${{ matrix.arch == 'arm64' && 'ARM aarch64' || 'x86-64' }}'

      # Only libraries of macOS itself (/usr/lib, /System), and the deployment target set above
      - name: macOS binary (system libraries, minimum macOS version)
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          file "$BIN"
          file "$BIN" | grep -q '${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}'
          otool -L "$BIN"
          if otool -L "$BIN" | tail -n +2 | grep -Ev '^[[:space:]]+(/usr/lib/|/System/)'; then
            echo "::error::the binary links a library outside macOS"; exit 1
          fi
          otool -L "$BIN" | grep -q libz && { echo "::error::the binary links the system zlib"; exit 1; }
          minos=$(otool -l "$BIN" | awk '/LC_BUILD_VERSION/{f=1} f && $1=="minos"{print $2; exit}')
          echo "minos $minos"
          test "$minos" = "$MACOSX_DEPLOYMENT_TARGET"

      - name: Smoke test (ADVANCED compile)
        shell: bash
        run: |
          printf 'function greet(name){var unused=1;return "Hello, "+name}\nwindow["greet"]=greet;\nconsole.log(greet("world"));\n' > smoke.js
          out=$("$BIN" --compilation_level=ADVANCED --js=smoke.js)
          echo "$out"
          test "$out" = 'function a(b){return"Hello, "+b}window.greet=a;console.log(a("world"));'

      # The official node:24-alpine image, from a mirror first: Docker Hub rate-limits the shared
      # runner addresses. The docker run steps below use the image pulled here.
      - name: Pull node:24-alpine
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            for image in mirror.gcr.io/library/node:24-alpine \
                public.ecr.aws/docker/library/node:24-alpine docker.io/library/node:24-alpine; do
              if docker pull -q "$image"; then
                docker tag "$image" node:24-alpine
                exit 0
              fi
              echo "::warning::could not pull $image"
            done
            sleep $((attempt * 20))
          done
          exit 1

      - name: Smoke test on Alpine (musl, no gcompat)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          out=$(docker run --rm -v "$PWD:/w" -w /w node:24-alpine "$BIN" --compilation_level=ADVANCED --js=smoke.js)
          echo "$out"
          test "$out" = 'function a(b){return"Hello, "+b}window.greet=a;console.log(a("world"));'

      # Every platform's binary must write the same bytes; the platform-outputs job compares them.
      - name: Compiles for the cross-platform comparison
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then PY=python; else PY=python3; fi
          "$PY" scripts/platform_outputs.py run --bin "$BIN" --args platform-outputs

      - uses: actions/upload-artifact@v7
        with:
          name: outputs-${{ matrix.platform }}-${{ matrix.arch }}
          path: build/platform-outputs/out/
          if-no-files-found: error

      - name: Third-party crate licenses match Cargo.lock
        if: matrix.platform == 'linux' && matrix.arch == 'x64'
        shell: bash
        run: |
          cargo fetch --locked
          python3 scripts/third_party_licenses.py --check

      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: 24

      - name: Test the npm wrapper against this binary
        shell: bash
        run: CLOSURE_RS_BINARY="$BIN" node --test npm/closure-rs/test/wrapper.test.mjs

      - name: Test the npm wrapper against this binary on Alpine (musl, no gcompat)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          docker run --rm -v "$PWD:/w" -w /w -e CLOSURE_RS_BINARY="$BIN" node:24-alpine \
            node --test npm/closure-rs/test/wrapper.test.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.platform }}-${{ matrix.arch }}
          path: bins/
          if-no-files-found: error

  # The outputs of every platform's binary for the same compiles must be identical, byte for byte.
  platform-outputs:
    name: same output on every platform
    needs: [build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: outputs-*
          path: outputs
      - name: Compare
        run: |
          ls outputs
          test "$(ls outputs | wc -l)" -eq 5
          python3 scripts/platform_outputs.py compare outputs/outputs-linux-x64 \
            outputs/outputs-linux-arm64 outputs/outputs-darwin-arm64 outputs/outputs-darwin-x64 \
            outputs/outputs-win32-x64

  npm-main:
    name: pack the npm package (all binaries)
    needs: [build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: 24

      - name: Generate the TypeScript types (must match the committed index.d.ts)
        run: |
          node scripts/gen_npm_types.mjs
          git diff --exit-code -- npm/closure-rs/

      # contrib/ (CONTRIB_PATH) is the Closure Compiler repository's contrib/ folder at the pinned
      # reference commit (scripts/fetch_reference.sh); fetch only that folder.
      - name: Fetch contrib/ at the pinned reference commit
        run: |
          pin=$(. scripts/paths.sh && echo "$REF_COMMIT")
          git init -q build/closure-compiler
          git -C build/closure-compiler remote add origin https://github.com/google/closure-compiler.git
          git -C build/closure-compiler sparse-checkout set --no-cone /contrib/
          git -C build/closure-compiler fetch -q --depth 1 --filter=blob:none origin "$pin"
          git -C build/closure-compiler checkout -q FETCH_HEAD
          test -d build/closure-compiler/contrib/externs

      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          merge-multiple: true
          path: bins

      - name: Pack (npm pack --ignore-scripts)
        run: |
          mkdir -p dist
          node scripts/npm_pack_main.mjs dist --contrib build/closure-compiler/contrib --binaries bins

      - uses: actions/upload-artifact@v7
        with:
          name: npm-main
          path: dist/*.tgz
          if-no-files-found: error

  # gates/ci.sh split in two parallel jobs: lint (unsafe check, license headers, fmt, clippy, no
  # ignored tests) and test. Locally `bash gates/ci.sh` still runs both.
  lint:
    name: lint (fmt, clippy, licenses)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: gates/ci.sh --lint
        run: bash gates/ci.sh --lint

  # The tests are built without debug info and at opt-level 1: about 6x smaller than the default
  # test profile (which does not fit a runner's disk comfortably) and 3x faster to run. Overflow
  # checks and debug assertions stay on, so the tests check exactly what `cargo test` checks.
  # cargo-nextest runs every test in its own process, all test binaries in parallel.
  test:
    name: test (ubuntu)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_DEV_OPT_LEVEL: 1
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_TEST_OPT_LEVEL: 1
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Build the tests
        run: cargo nextest run --workspace --locked --no-run
      - name: gates/ci.sh --test
        run: bash gates/ci.sh --test

  # Release runs compare closure-rs with the Java compiler on real projects before publishing
  # (java-comparison.yml); pushes and pull requests skip it.
  java-comparison:
    name: compare with the Java compiler
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/java-comparison.yml

  publish:
    name: publish to npm (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [build, platform-outputs, java-comparison, lint, test, npm-main]
    runs-on: ubuntu-22.04
    environment: npm
    permissions:
      contents: write   # the git tag and GitHub Release of the published version
      id-token: write   # npm trusted publishing (OIDC); provenance is added automatically
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm-main
          path: dist
      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm >= 11.5.1 (trusted publishing)
        run: npm install -g npm@^11.5.1 --ignore-scripts
      - name: Publish (dist-tag from the run form)
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
        # ./ is required: npm reads a bare dist/x.tgz as the GitHub repository shorthand "dist/x.tgz"
        run: npm publish ./dist/*.tgz --tag "$DIST_TAG" --access public

      # The published version as git tag v<version> on the released commit and a GitHub Release with
      # the pull requests merged since the previous release; prerelease versions are marked as such.
      - name: Tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          version=$(tar -xzOf dist/*.tgz package/package.json | jq -r .version)
          flags=(--target "$GITHUB_SHA" --title "$version" --generate-notes)
          case "$version" in
            *-*) flags+=(--prerelease --latest=false) ;;
            *) if [ "$DIST_TAG" = latest ]; then flags+=(--latest); else flags+=(--latest=false); fi ;;
          esac
          gh release create "v$version" -R "$GITHUB_REPOSITORY" "${flags[@]}"
