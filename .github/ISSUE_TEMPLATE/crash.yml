name: Crash or npm wrapper bug
description: closure-rs panics or is killed, or the npm package does not behave like google-closure-compiler's API.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: closure-rs version
      placeholder: "20261006.0.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Linux x64, Windows x64, Other (built from source)]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The flags or the npm API call, and the input (or a link to it).
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happens
      description: The error output and exit code, and what you expected instead.
      render: text
    validations:
      required: true
